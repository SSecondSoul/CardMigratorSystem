<html>
<head>
    <meta charset="utf-8" />
    <title>Vue Component Test Runner</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <script src="https://unpkg.com/http-vue-loader"></script>
</head>
<body>
    <div id="app">
        <!-- 在这里测试组件 -->

        ></gradebook-matrix>
    </div>

        new Vue({
            el: '#app',
            components: {
                'gradebook-matrix': httpVueLoader('../../data/datasets/components/03_complex/GradebookMatrix/vue/GradebookMatrix.vue'),
            }
        });
    </script>
