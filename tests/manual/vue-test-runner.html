<html>
<head>

    <script src="https://unpkg.com/http-vue-loader"></script>
</head>
<body>
    <div id="app">
        <!-- 在这里测试组件 -->

            title="系统更新"

            @read="handleRead"
        />

        new Vue({
            el: '#app',
            components: {
                'notification-card': httpVueLoader('../../data/datasets/components/01_simple/NotificationCard/vue/NotificationCard.vue'),

            methods: {
                handleRead(title) {
                    console.log(`已读通知: ${title}`);
                }
            }
        });
    </script>
</body>
</html>
